<style>
    /*.items div {
        border: 1px solid gray;
        margin: 5px;
        padding: 10px;
    }*/

    .pager div {
        float: left;
        border: 1px solid gray;
        margin: 5px;
        padding: 10px;
    }

        .pager div.disabled {
            opacity: 0.25;
        }

    .pager .pageNumbers a {
        display: inline-block;
        padding: 0 10px;
        color: gray;
    }

        .pager .pageNumbers a.active {
            color: orange;
        }

    .pager {
        overflow: hidden;
    }

    .paginate-no-scroll .items div {
        height: 250px;
    }
    .youtube-container {
        display: block;
        width: 100%;
       /* max-width: 600px;*/
        margin: 30px auto;
    }

    .youtube-player {
        display: block;
        margin 20px auto;
        padding-bottom: 56.25%;
        overflow: hidden;
        position: relative;
        width: 100%;
        height: 100%;
        cursor: hand;
        cursor: pointer;
        display: block;
    }

    img.youtube-thumbnail {
        bottom: 0;
        display: block;
        left: 0;
        margin: auto;
        max-width: 100%;
        width: 100%;
        position: absolute;
        right: 0;
        top: 0;
        height: auto;
    }

    div.youtube-play-btn {
        height: 72px;
        width: 72px;
        left: 50%;
        top: 50%;
        margin-left: -36px;
        margin-top: -36px;
        position: absolute;
        background: url("https://freepngimg.com/thumb/categories/1398.png") no-repeat center center;
        background-size: 72px 72px;
    }

    .youtube-iframe {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
    }
</style>

<div class="page-header">
    <div class="row align-items-end">
        <div class="col-sm mb-2 mb-sm-0">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb breadcrumb-no-gutter">
                    <li class="breadcrumb-item"><a class="breadcrumb-link" href="#/home">Home</a></li>
                    <li class="breadcrumb-item"><a class="breadcrumb-link" href="#/form/records/2244">Article Master</a></li>
                    <li class="breadcrumb-item active" aria-current="page">{{ArticleData.AR_TITLE}}</li>
                </ol>
            </nav>
            <!--<h1 class="page-header-title ms-2">Counselllor Profile</h1>-->
        </div>
        <!-- End Col -->
        <!-- End Col -->
    </div>
    <!-- End Row -->
</div>


<div class="row mt-2">
    <div class="col-md-12">
        <a class="btn btn-primary" href="#/form/records/2244">Back</a>
    </div>

</div>

<div class="row mt-3">
    <div class="col-md-8">
        <div class="row ms-3">
            <div class="col-md-8">
                <div class="form-check-inline">
                    <label class="form-check-label" for="formInlineCheck1"><input type="radio" id="formInlineCheck1" name="IS_ADMIN_APPROVED" ng-click="ApprovedRejectArticle()" ng-checked="ArticleData.IS_ADMIN_APPROVED=='YES'" value="YES" class="form-check-input"> Approve (default)</label>
                </div>

                <!-- End Form Check -->
                <!-- Form Check -->
                <div class="form-check-inline">
                    <label class="form-check-label" for="formInlineCheck2"><input type="radio" id="formInlineCheck2" name="IS_ADMIN_APPROVED" ng-click="ApprovedRejectArticle()" value="NO" ng-checked="ArticleData.IS_ADMIN_APPROVED=='NO'" class="form-check-input"> Reject</label>
                </div>
            </div>
            <div class="col-md-4">
                <div class="form-check-inline float-end">
                    <label class="form-check-label" for="IS_RECOMMENDED"><input type="checkbox" id="IS_RECOMMENDED" name="IS_RECOMMENDED" ng-click="MarkHotTopic()" value="YES" ng-checked="ArticleData.IS_RECOMMENDED=='YES'" class="form-check-input"> Hot topic</label>
                </div>
            </div>
        </div>

    </div>
</div>
<div class="row mt-2 ms-3">
    <div class="col-md-12 mt-2">
        <h3>{{ArticleData.AR_TITLE}}</h3>
    </div>
    <div class="col-md-12">
        <h6>{{ArticleData.AR_CAT_NAME}}</h6>
    </div>
    <div class="col-md-12">
        <h6>Author {{ArticleData.councellor_name}} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Posted on {{ArticleData.created_at}}</h6>
    </div>

    <div class="col-md-8">
        <p>{{ArticleData.AR_CONTENT}}</p>
    </div>
    <div class="col-md-8">
        <div class="card">
            <img ng-if="ArticleData.AR_IMAGES && ArticleData.AR_IMAGES!='null' && ArticleData.AR_IMAGES!='' && (ArticleData.AR_YOUTUBE_LINKS=='' || !ArticleData.AR_YOUTUBE_LINKS || ArticleData.AR_YOUTUBE_LINKS=='null')" class="card-img card-img-top" ng-src="{{ArticleData.AR_IMAGES}}" alt="Card image cap" />
            <div id="iframe_youtube" ng-if="ArticleData.AR_IMAGES && ArticleData.AR_IMAGES!='null' && ArticleData.AR_IMAGES!='' && (ArticleData.AR_YOUTUBE_LINKS!='' && ArticleData.AR_YOUTUBE_LINKS && ArticleData.AR_YOUTUBE_LINKS!='null')">
                
            </div>
            <div id="iframe_youtube" ng-if="ArticleData.AR_YOUTUBE_LINKS!='' && ArticleData.AR_YOUTUBE_LINKS && ArticleData.AR_YOUTUBE_LINKS!='null' && (!ArticleData.AR_IMAGES || ArticleData.AR_IMAGES=='null' || ArticleData.AR_IMAGES=='')">
               
            </div>
           

            <div class="card-footer">
                <div class="row">
                    <div class="col-md-12">
                        <button class="btn btn-primary float-end" ng-class="{'show':!isComment,'hide':isComment}" ng-click="isComment=!isComment">Comment</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-8" ng-class="{'show':isComment,'hide':!isComment}">
        <textarea rows="10" id="reply-text" ng-model="ArticleData.AR_ADMIN_COMMENT" class="form-control" style="resize:none"></textarea>
    </div>
    <div class="col-md-8 mt-2" ng-class="{'show':isComment,'hide':!isComment}">
        <button class="btn btn-primary float-end" ng-click="CommentSumbit()">Comment</button>
        <button class="btn btn-default float-end me-2" ng-click="isComment=!isComment">Cancel</button>
    </div>
</div>
<script src="Content/assets/js/paginga.jquery.min.js"></script>
